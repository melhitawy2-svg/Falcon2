name: Falcon VPN Android Build

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      accept-android-sdk-licenses: true

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.13'

  - name: Extract Falcon VPN source
    run: |
      ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP source file found"
        exit 1
      fi

      echo "Found source: $ZIP_FILE"
      mkdir -p project
      unzip -q "$ZIP_FILE" -d project

      PROJECT_DIR=$(find project -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)

      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Android project not found"
        find project -maxdepth 4 -type f
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Falcon-VPN-APK
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
