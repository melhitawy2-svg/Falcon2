name: Falcon VPN APK Build

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: |
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.13'

  - name: Extract Falcon VPN project
    run: |
      mkdir project
      unzip -q FalconVPN-v0.27.0-source.zip -d project
      find project -name settings.gradle.kts -print

  - name: Build APK
    working-directory: project/falcon_v015
    run: gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Falcon-VPN-APK
      path: project/falcon_v015/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
