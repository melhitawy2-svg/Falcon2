name: Falcon VPN Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          ZIP_PATH="$GITHUB_WORKSPACE/FalconVPN-Starter.zip"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "ERROR: FalconVPN-Starter.zip not found!"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Source ZIP found:"
          ls -lh "$ZIP_PATH"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract source ZIP
        run: |
          mkdir -p project
          unzip -q "$GITHUB_WORKSPACE/FalconVPN-Starter.zip" -d project

      - name: Verify project structure
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/project"

          echo "Checking project files..."

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle settings file not found in project root!"
            find "$PROJECT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app module not found!"
            find "$PROJECT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project structure verified successfully."

      - name: Build Falcon VPN APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK found: $APK_PATH"

      - name: Upload Falcon VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
