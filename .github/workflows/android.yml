name: Falcon VPN Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Falcon2 repository
        uses: actions/checkout@v4

      - name: Verify ZIP source file
        run: |
          ZIP_PATH="FalconVPN-v0.27.0-source-reupload.zip"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "ERROR: Source ZIP file not found!"
            echo "Expected path: $GITHUB_WORKSPACE/$ZIP_PATH"
            echo "Repository files:"
            ls -la
            exit 1
          fi

          echo "ZIP file found successfully:"
          ls -lh "$ZIP_PATH"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Falcon VPN source
        run: |
          mkdir -p project
          unzip -q "$GITHUB_WORKSPACE/FalconVPN-v0.27.0-source-reupload.zip" -d project

          echo "Extracted source files:"
          ls -la project

      - name: Locate project directory
        run: |
          PROJECT_DIR=$(find project -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            find project -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Verify Android app module
        run: |
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app module not found!"
            ls -la "$PROJECT_DIR"
            exit 1
          fi

          echo "Android app module verified."

      - name: Build Falcon VPN APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        run: |
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Generated APK: $APK_PATH"

      - name: Upload Falcon VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
